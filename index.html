<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numogram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .numogram-container {
    position: relative;
    width: 900px;
    height: 900px;
    background: #000;
  }
  svg.numogram-svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="numogram-container">
<svg class="numogram-svg" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow for zone 1 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Stipple/grain texture for flow paths -->
    <filter id="grain" x="-50%" y="-50%" width="200%" height="200%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="4" seed="2" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.6  0 0 0 0 0.6  0 0 0 -2.1 1.5" result="thresh"/>
      <feComposite operator="in" in="thresh" in2="SourceGraphic" result="masked"/>
    </filter>
    <filter id="grainDense" x="-50%" y="-50%" width="200%" height="200%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="2.0" numOctaves="5" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.7  0 0 0 0 0.7  0 0 0 -1.8 1.4" result="thresh"/>
      <feComposite operator="in" in="thresh" in2="SourceGraphic" result="masked"/>
    </filter>
  </defs>

  <!-- ======== FLOW PATHS (stippled/grainy texture) ======== -->

  <!-- Rise: from 7+ curving up to Warp -->
  <path d="M 728,415 C 790,320 780,220 680,155 Q 650,130 585,140"
        stroke="#aaa" stroke-width="55" fill="none" stroke-linecap="round" filter="url(#grain)"/>
  <path d="M 728,415 C 790,320 780,220 680,155 Q 650,130 585,140"
        stroke="#ddd" stroke-width="30" fill="none" stroke-linecap="round" filter="url(#grainDense)" opacity="0.5"/>

  <!-- Hold: from 7+ area left to 5+ area -->
  <path d="M 718,408 Q 580,375 400,408"
        stroke="#aaa" stroke-width="55" fill="none" stroke-linecap="round" filter="url(#grain)"/>
  <path d="M 718,408 Q 580,375 400,408"
        stroke="#ddd" stroke-width="30" fill="none" stroke-linecap="round" filter="url(#grainDense)" opacity="0.5"/>

  <!-- Sink: from 4- area down to 1+ -->
  <path d="M 312,548 Q 390,605 468,648"
        stroke="#aaa" stroke-width="55" fill="none" stroke-linecap="round" filter="url(#grain)"/>
  <path d="M 312,548 Q 390,605 468,648"
        stroke="#ddd" stroke-width="30" fill="none" stroke-linecap="round" filter="url(#grainDense)" opacity="0.5"/>

  <!-- Vertical trunk: 1+ -> 8- -->
  <path d="M 478,688 L 480,768"
        stroke="#999" stroke-width="42" fill="none" stroke-linecap="round" filter="url(#grain)"/>

  <!-- 8- -> 9+ -->
  <path d="M 482,812 L 490,868"
        stroke="#888" stroke-width="36" fill="none" stroke-linecap="round" filter="url(#grain)"/>

  <!-- 9+ -> 0- -->
  <path d="M 490,918 L 486,972"
        stroke="#777" stroke-width="28" fill="none" stroke-linecap="round" filter="url(#grain)"/>

  <!-- ======== FLOW LABELS ======== -->
  <text x="555" y="368" fill="#fff" font-size="30" font-weight="800" font-family="Nunito,sans-serif" text-anchor="middle">Hold</text>
  <text x="378" y="578" fill="#fff" font-size="30" font-weight="800" font-family="Nunito,sans-serif" text-anchor="middle">Sink</text>
  <text x="792" y="305" fill="#fff" font-size="30" font-weight="800" font-family="Nunito,sans-serif" text-anchor="middle">Rise</text>

  <!-- ======== WARP ENCOMPASSING CIRCLES ======== -->
  <circle cx="500" cy="168" r="125" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <circle cx="530" cy="152" r="78" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.4"/>

  <!-- Warp (Current) label -->
  <text x="652" y="155" fill="#fff" font-size="22" font-weight="800" font-family="Nunito,sans-serif">Warp</text>
  <text x="652" y="178" fill="#fff" font-size="17" font-weight="400" font-family="Nunito,sans-serif">(Current)</text>

  <!-- ======== PLEX ENCOMPASSING CIRCLES ======== -->
  <circle cx="494" cy="942" r="85" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
  <circle cx="487" cy="972" r="48" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.4"/>

  <!-- Plex (current) label -->
  <text x="598" y="918" fill="#fff" font-size="22" font-weight="800" font-family="Nunito,sans-serif">Plex</text>
  <text x="598" y="940" fill="#fff" font-size="17" font-weight="400" font-family="Nunito,sans-serif">(current)</text>

  <!-- ======== CONNECTION LINES ======== -->
  <!-- 3 to 6 -->
  <line x1="420" y1="198" x2="522" y2="165" stroke="#fff" stroke-width="2" opacity="0.55"/>
  <!-- 6 to 2 -->
  <line x1="558" y1="182" x2="615" y2="300" stroke="#fff" stroke-width="2" opacity="0.55"/>
  <!-- 2 to 7 -->
  <line x1="648" y1="335" x2="708" y2="398" stroke="#fff" stroke-width="1.5" opacity="0.45"/>
  <!-- 5 to 4 -->
  <line x1="392" y1="445" x2="315" y2="520" stroke="#fff" stroke-width="2" opacity="0.55"/>
  <!-- 4 to 1 -->
  <line x1="325" y1="558" x2="455" y2="642" stroke="#fff" stroke-width="1.5" opacity="0.45"/>
  <!-- 7 rise curve to Warp -->
  <path d="M 738,398 Q 768,270 668,158" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.35"/>
  <!-- 1 to 8 -->
  <line x1="478" y1="688" x2="480" y2="765" stroke="#fff" stroke-width="2" opacity="0.55"/>
  <!-- 8 to 9 -->
  <line x1="483" y1="815" x2="490" y2="868" stroke="#fff" stroke-width="2" opacity="0.55"/>
  <!-- 9 to 0 -->
  <line x1="492" y1="918" x2="488" y2="960" stroke="#fff" stroke-width="2" opacity="0.55"/>
  <!-- Gate connection lines -->
  <line x1="418" y1="668" x2="455" y2="655" stroke="#fff" stroke-width="1.5" opacity="0.35"/>
  <line x1="535" y1="640" x2="500" y2="650" stroke="#fff" stroke-width="1.5" opacity="0.35"/>

  <!-- ======== ZONE 3+ ======== -->
  <circle cx="395" cy="198" r="28" fill="#000" stroke="#fff" stroke-width="2.5"/>
  <text x="379" y="208" fill="#fff" font-size="24" font-weight="900" font-family="Nunito,sans-serif">3</text>
  <text x="410" y="190" fill="#fff" font-size="14" font-weight="700" font-family="Nunito,sans-serif">+</text>
  <circle cx="395" cy="220" r="5" fill="none" stroke="#ff8800" stroke-width="1.5"/>
  <polygon points="395,230 389,240 401,240" fill="none" stroke="#ff8800" stroke-width="1.5"/>
  <text x="338" y="178" fill="#22dd22" font-size="19" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">"zx"</text>

  <!-- ======== ZONE 6- ======== -->
  <circle cx="550" cy="152" r="30" fill="#000" stroke="#fff" stroke-width="2.5"/>
  <text x="534" y="162" fill="#fff" font-size="24" font-weight="900" font-family="Nunito,sans-serif">6</text>
  <text x="565" y="145" fill="#fff" font-size="14" font-weight="700" font-family="Nunito,sans-serif">-</text>
  <circle cx="550" cy="178" r="5" fill="none" stroke="#ff00ff" stroke-width="1.5"/>
  <text x="572" y="205" fill="#cccc00" font-size="19" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">"tch"</text>

  <!-- ======== ZONE 2- ======== -->
  <circle cx="625" cy="318" r="27" fill="#000" stroke="#fff" stroke-width="2.5"/>
  <text x="610" y="327" fill="#fff" font-size="24" font-weight="900" font-family="Nunito,sans-serif">2</text>
  <text x="640" y="310" fill="#fff" font-size="14" font-weight="700" font-family="Nunito,sans-serif">-</text>
  <circle cx="625" cy="340" r="5" fill="none" stroke="#4488ff" stroke-width="1.5"/>
  <text x="652" y="308" fill="#4488ff" font-size="19" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">"dt"</text>

  <!-- ======== ZONE 5+ ======== -->
  <circle cx="390" cy="418" r="27" fill="#000" stroke="#fff" stroke-width="2.5"/>
  <text x="375" y="427" fill="#fff" font-size="24" font-weight="900" font-family="Nunito,sans-serif">5</text>
  <text x="405" y="410" fill="#fff" font-size="14" font-weight="700" font-family="Nunito,sans-serif">+</text>
  <circle cx="390" cy="440" r="5" fill="none" stroke="#cc9900" stroke-width="1.5"/>
  <text x="345" y="462" fill="#ccaa00" font-size="19" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">"ktt"</text>

  <!-- ======== ZONE 4- ======== -->
  <circle cx="300" cy="538" r="27" fill="#000" stroke="#ff2222" stroke-width="2.5"/>
  <text x="285" y="547" fill="#fff" font-size="24" font-weight="900" font-family="Nunito,sans-serif">4</text>
  <text x="315" y="530" fill="#fff" font-size="14" font-weight="700" font-family="Nunito,sans-serif">-</text>
  <circle cx="300" cy="560" r="5" fill="none" stroke="#ff2222" stroke-width="1.5"/>
  <text x="245" y="580" fill="#ff3333" font-size="19" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">"skr"</text>

  <!-- ======== ZONE 7+ ======== -->
  <circle cx="728" cy="408" r="27" fill="#000" stroke="#fff" stroke-width="2.5"/>
  <text x="713" y="417" fill="#fff" font-size="24" font-weight="900" font-family="Nunito,sans-serif">7</text>
  <text x="743" y="400" fill="#fff" font-size="14" font-weight="700" font-family="Nunito,sans-serif">+</text>
  <circle cx="728" cy="430" r="5" fill="none" stroke="#4488ff" stroke-width="1.5"/>
  <text x="756" y="418" fill="#4488ff" font-size="19" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">"pb"</text>

  <!-- ======== ZONE 1+ (bright white, glowing) ======== -->
  <circle cx="478" cy="652" r="32" fill="#fff" stroke="#fff" stroke-width="3" filter="url(#glow)"/>
  <text x="461" y="663" fill="#000" font-size="26" font-weight="900" font-family="Nunito,sans-serif">1</text>
  <text x="493" y="645" fill="#000" font-size="15" font-weight="700" font-family="Nunito,sans-serif">+</text>
  <circle cx="478" cy="680" r="5" fill="none" stroke="#ff8800" stroke-width="1.5"/>
  <polygon points="478,688 472,698 484,698" fill="#fff" stroke="#fff" stroke-width="1"/>
  <text x="438" y="718" fill="#cccc00" font-size="19" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">"gl"</text>

  <!-- ======== ZONE 8- ======== -->
  <circle cx="482" cy="788" r="27" fill="#000" stroke="#fff" stroke-width="2.5"/>
  <text x="467" y="797" fill="#fff" font-size="24" font-weight="900" font-family="Nunito,sans-serif">8</text>
  <text x="497" y="780" fill="#fff" font-size="14" font-weight="700" font-family="Nunito,sans-serif">-</text>
  <polygon points="482,761 476,751 488,751" fill="none" stroke="#fff" stroke-width="1.5"/>
  <circle cx="482" cy="810" r="5" fill="none" stroke="#44cc44" stroke-width="1.5"/>
  <text x="395" y="783" fill="#44cc44" font-size="19" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">"mnm"</text>

  <!-- ======== ZONE 9+ ======== -->
  <circle cx="492" cy="890" r="27" fill="#000" stroke="#fff" stroke-width="2.5"/>
  <text x="477" y="899" fill="#fff" font-size="24" font-weight="900" font-family="Nunito,sans-serif">9</text>
  <text x="507" y="882" fill="#fff" font-size="14" font-weight="700" font-family="Nunito,sans-serif">+</text>
  <polygon points="492,919 486,929 498,929" fill="#fff" stroke="#fff" stroke-width="1"/>
  <circle cx="492" cy="912" r="5" fill="none" stroke="#cccc00" stroke-width="1.5"/>
  <text x="520" y="892" fill="#cccc00" font-size="17" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">"tn"</text>

  <!-- ======== ZONE 0- ======== -->
  <circle cx="486" cy="985" r="27" fill="#000" stroke="#fff" stroke-width="2.5"/>
  <text x="471" y="994" fill="#fff" font-size="24" font-weight="900" font-family="Nunito,sans-serif">0</text>
  <text x="500" y="978" fill="#fff" font-size="14" font-weight="700" font-family="Nunito,sans-serif">-</text>
  <polygon points="486,958 480,948 492,948" fill="none" stroke="#fff" stroke-width="1.5"/>
  <circle cx="486" cy="1008" r="5" fill="none" stroke="#44cc44" stroke-width="1.5"/>
  <text x="418" y="1038" fill="#44cc44" font-size="17" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">"eiaoung"</text>

  <!-- ======== GATE NUMBERS (small circled numbers) ======== -->
  <g opacity="0.75" font-family="Nunito,sans-serif" font-weight="700" fill="#fff" font-size="13">
    <!-- 15 - top of Warp -->
    <circle cx="500" cy="46" r="14" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="500" y="51" text-anchor="middle">15</text>
    <!-- 6 - upper right of Warp -->
    <circle cx="555" cy="76" r="14" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="555" y="81" text-anchor="middle">6</text>
    <!-- 21 - between 3 and 6 -->
    <circle cx="465" cy="158" r="14" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="465" y="163" text-anchor="middle">21</text>
    <!-- 3 - below zone 3 -->
    <circle cx="370" cy="252" r="14" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="370" y="257" text-anchor="middle">3</text>
    <!-- 1 - above zone 1 -->
    <circle cx="498" cy="600" r="14" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="498" y="605" text-anchor="middle">1</text>
    <!-- 28 - right of zone 1 -->
    <circle cx="538" cy="635" r="14" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="538" y="640" text-anchor="middle">28</text>
    <!-- 10 - left of zone 1 -->
    <circle cx="418" cy="668" r="14" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="418" y="673" text-anchor="middle">10</text>
    <!-- 36 - between 8 and 9 -->
    <circle cx="508" cy="845" r="14" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="508" y="850" text-anchor="middle">36</text>
    <!-- 45 - between 9 and 0 -->
    <circle cx="458" cy="940" r="14" fill="none" stroke="#fff" stroke-width="1.5"/>
    <text x="458" y="945" text-anchor="middle">45</text>
  </g>

  <!-- ======== REGION LABELS ======== -->

  <!-- Warp (top-left) -->
  <text x="50" y="72" fill="#fff" font-size="34" font-weight="900" font-family="Nunito,sans-serif" text-decoration="underline">Warp</text>
  <text x="55" y="104" fill="#22dd22" font-size="24" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">Hyper-Reality</text>
  <text x="55" y="134" fill="#22dd22" font-size="24" font-weight="700" font-family="Nunito,sans-serif">Djynxx 6::3</text>

  <!-- e-Circuit (left middle) -->
  <text x="50" y="448" fill="#fff" font-size="32" font-weight="900" font-family="Nunito,sans-serif" text-decoration="underline">e-Circuit</text>
  <text x="55" y="480" fill="#22dd22" font-size="21" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">breakthrough</text>
  <text x="55" y="506" fill="#22dd22" font-size="21" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">connected</text>
  <text x="55" y="532" fill="#22dd22" font-size="21" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">psychoactives</text>

  <!-- Plex (bottom-left) -->
  <text x="50" y="852" fill="#fff" font-size="34" font-weight="900" font-family="Nunito,sans-serif" text-decoration="underline">Plex</text>
  <text x="55" y="884" fill="#22dd22" font-size="21" font-weight="700" font-family="Nunito,sans-serif" font-style="italic">Eiriel (Tchukululok)</text>
  <text x="55" y="912" fill="#22dd22" font-size="21" font-weight="700" font-family="Nunito,sans-serif">Dissociative Void</text>
  <text x="55" y="940" fill="#22dd22" font-size="21" font-weight="700" font-family="Nunito,sans-serif">Uttunul 9::0</text>

  <!-- ======== ZONE / ASPECT TABLE (top-right) ======== -->
  <g transform="translate(830,48)" font-family="Nunito,sans-serif">
    <rect x="0" y="0" width="80" height="30" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="40" y="22" fill="#fff" font-size="16" font-weight="900" text-anchor="middle">Zone</text>
    <rect x="80" y="0" width="140" height="30" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="150" y="22" fill="#fff" font-size="16" font-weight="900" text-anchor="middle">Aspect</text>

    <rect x="0" y="30" width="80" height="28" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="40" y="50" fill="#fff" font-size="14" font-weight="700" font-family="monospace" text-anchor="middle">9::0</text>
    <rect x="80" y="30" width="140" height="28" fill="#222" stroke="#fff" stroke-width="1"/>
    <text x="90" y="50" fill="#fff" font-size="13" font-weight="700">Foundation</text>

    <rect x="0" y="58" width="80" height="28" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="40" y="78" fill="#fff" font-size="14" font-weight="700" font-family="monospace" text-anchor="middle">8::1</text>
    <rect x="80" y="58" width="140" height="28" fill="#222" stroke="#fff" stroke-width="1"/>
    <text x="90" y="78" fill="#fff" font-size="13" font-weight="700">Anamnesis</text>

    <rect x="0" y="86" width="80" height="28" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="40" y="106" fill="#fff" font-size="14" font-weight="700" font-family="monospace" text-anchor="middle">7::2</text>
    <rect x="80" y="86" width="140" height="28" fill="#222" stroke="#fff" stroke-width="1"/>
    <text x="90" y="106" fill="#fff" font-size="13" font-weight="700">Geotraumatics</text>

    <rect x="0" y="114" width="80" height="28" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="40" y="134" fill="#fff" font-size="14" font-weight="700" font-family="monospace" text-anchor="middle">6::3</text>
    <rect x="80" y="114" width="140" height="28" fill="#222" stroke="#fff" stroke-width="1"/>
    <text x="90" y="134" fill="#fff" font-size="13" font-weight="700">Fortress</text>

    <rect x="0" y="142" width="80" height="28" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="40" y="162" fill="#fff" font-size="14" font-weight="700" font-family="monospace" text-anchor="middle">5::4</text>
    <rect x="80" y="142" width="140" height="28" fill="#222" stroke="#fff" stroke-width="1"/>
    <text x="90" y="162" fill="#fff" font-size="13" font-weight="700">Apocalypse</text>
  </g>

</svg>
</div>
</body>
</html>
