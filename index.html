<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COP ↔ USD Calculator</title>
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="icon" type="image/png" href="./icon-512.png">
    <link rel="apple-touch-icon" href="./icon-512.png">
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        .badge { display: none; background: #ff9800; color: white; padding: 5px; border-radius: 5px; font-size: 12px; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin: 10px 0; font-size: 16px; }
    </style>
</head>
<body>
    <h2>COP ↔ USD Calculator</h2>
    <div id="offline-badge" class="badge">⚠️ Using saved rate (Offline)</div>

    <label>USD:</label>
    <input type="number" id="usd" placeholder="Enter USD..." oninput="convert('usd')">
    
    <label>COP:</label>
    <input type="number" id="cop" placeholder="Enter COP..." oninput="convert('cop')">

    <p>Current Rate: <span id="rate-display">Loading...</span></p>

    <script>
        let exchangeRate = null;
        const badge = document.getElementById('offline-badge');
        const rateDisplay = document.getElementById('rate-display');

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registered"))
                .catch(err => console.error("SW Registration failed", err));
        }

        function fetchRate() {
            fetch('https://open.er-api.com/v6/latest/USD') 
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    exchangeRate = data.rates.COP;
                    localStorage.setItem('saved_cop_rate', exchangeRate);
                    rateDisplay.innerText = `1 USD = ${exchangeRate} COP`;
                    badge.style.display = 'none'; 
                })
                .catch(error => {
                    const savedRate = localStorage.getItem('saved_cop_rate');
                    if (savedRate) {
                        exchangeRate = parseFloat(savedRate);
                        rateDisplay.innerText = `1 USD = ${exchangeRate} COP`;
                        badge.style.display = 'inline-block'; 
                    } else {
                        rateDisplay.innerText = 'Offline - No saved rate available';
                    }
                });
        }

        function convert(source) {
            if (!exchangeRate) return;
            const usdInput = document.getElementById('usd');
            const copInput = document.getElementById('cop');

            if (source === 'usd' && usdInput.value) {
                copInput.value = (usdInput.value * exchangeRate).toFixed(2);
            } else if (source === 'cop' && copInput.value) {
                usdInput.value = (copInput.value / exchangeRate).toFixed(2);
            }
        }

        fetchRate();
    </script>
</body>
</html>
