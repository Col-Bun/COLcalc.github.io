<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Decimal Numogram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
  
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }
  
  body {
    background: #050505;
    color: #e0e0e0;
    font-family: 'Nunito', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    max-width: 1400px;
    width: 100%;
    align-items: flex-start;
  }

  .numogram-wrapper {
    flex: 1 1 600px;
    background: #000;
    border-radius: 20px;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.8);
    border: 2px solid rgba(255,50,50,0.3);
    overflow: hidden;
    aspect-ratio: 1;
  }

  .numogram-wrapper svg { 
    width: 100%; 
    height: 100%; 
    display: block; 
  }

  .zone-group {
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .zone-group:hover circle:first-child {
    fill: #1a1a1a;
    stroke: #ff3c8e;
    filter: drop-shadow(0 0 15px rgba(255, 60, 142, 0.8));
  }

  .info-panel {
    flex: 1 1 400px;
    background: rgba(20, 0, 0, 0.6);
    border: 2px solid #ff3333;
    border-radius: 16px;
    padding: 24px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    height: calc(100vh - 40px);
    max-height: 900px;
    overflow-y: auto;
  }

  .info-panel::-webkit-scrollbar {
    width: 8px;
  }
  .info-panel::-webkit-scrollbar-thumb {
    background: #ff3333;
    border-radius: 4px;
  }

  .info-panel h2 {
    color: #ff3c8e;
    margin-bottom: 12px;
    font-size: 1.8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .info-panel h3 {
    color: #a8e84c;
    margin-top: 20px;
    margin-bottom: 8px;
    font-size: 1.2rem;
    border-bottom: 1px solid rgba(168,232,76,0.3);
    padding-bottom: 4px;
  }

  .info-panel p {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.85);
    margin-bottom: 12px;
    line-height: 1.6;
  }

  .info-panel ul {
    margin-left: 20px;
    margin-bottom: 12px;
    color: rgba(255,255,255,0.85);
  }

  .info-panel li {
    margin-bottom: 6px;
  }

  .citation {
    font-size: 0.75rem;
    color: #00e5ff;
    vertical-align: super;
  }
</style>
</head>

    <h2>The Decimal Numogram</h2>
    <p>Pandemonium is the complete system of Lemurian demonism and time sorcery <span class="citation">[cite: 1]</span>. It consists of two principal components: Numogram (time-map) and Matrix (listing the names, numbers and attributes of the demons) <span class="citation">[cite: 1]</span>.</p>
    <p>The system is constructed according to immanent criteria latent in decimal numeracy, and involves only basic arithmetical operations (assembled from additions and subtractions) <span class="citation">[cite: 1]</span>. The Numogram, or Decimal Labyrinth, is composed of ten zones (numbered 0-9) and their interconnections <span class="citation">[cite: 1]</span>. These zones are grouped into five pairs (syzygies) by nine-sum twinning [zygonovism] <span class="citation">[cite: 1]</span>.</p>
    <p><strong>Click on any numbered zone (0-9) on the map to reveal its attributes, planetary alignments, and esoteric data.</strong></p>
  `;

      <h2>Zone Zero</h2>
      <h3>The Numeral 0</h3>
      <p>The modern figure zero (0) is a closed circle, oval, or ellipse (sometimes differentiated from the letter ‘O' by a diagonal slash) <span class="citation">[cite: 1]</span>. Its archaic Hindu form was the ‘bindu' (or dot, retained in the modern system as the ‘decimal point') <span class="citation">[cite: 1]</span>. Both of these ciphers are of such abstraction that no rapid summary can be other than misleading <span class="citation">[cite: 1]</span>.</p>
      <p>The figure ‘0' designates the number zero, anterior to the distinction odd/even, and also to the determination of primes (zeroth prime = 1) <span class="citation">[cite: 1]</span>. Zero is the only natural number that is indivisible by one <span class="citation">[cite: 1]</span>. The division of any number by zero produces an infinity (multiplication of any number by zero = 0), in this respect zero treats itself as any other number <span class="citation">[cite: 1]</span>.</p>
      <p>Zero digitally cumulates to zero <span class="citation">[cite: 1]</span>. Numeric Keypad direction: anomalous <span class="citation">[cite: 1]</span>.</p>

      <h3>The Zeroth Planet: Sol</h3>
      <p>The Sun (Sol-0) is by far the largest body in the Solar-system <span class="citation">[cite: 1]</span>. It spins on its own axis at different speeds (with a period of rotation varying from about 36 Earth-days at the poles, to 25.4 at the equator) <span class="citation">[cite: 1]</span>. The sun-spot cycle - driven by periodic reversals in the solar magnetoprocess - lasts for approximately twenty-two years <span class="citation">[cite: 1]</span>.</p>
      <p>The Sun is approximately 4.5 billion years old, roughly half-way through it's normal existence (or main-sequence of hydrogen-to-helium nucleosynthesis) <span class="citation">[cite: 1]</span>. The preponderance of the Sun's mass within the Solar-system is such that the orbits of the planets (notably Jupiter) only produce minor perturbations in its behavior <span class="citation">[cite: 1]</span>. Sun-worship is extremely prevalent within human religious history <span class="citation">[cite: 1]</span>.</p>

      <h3>System Notes</h3>
      <p>Zone-0 is the first of two zones mutually composing the Plex-region of the Numogram <span class="citation">[cite: 1]</span>. Its Syzygetic-twin is Zone-9 <span class="citation">[cite: 1]</span>. This 9+0 Syzygy is carried by the demon Uttunul <span class="citation">[cite: 1]</span>. Zone-0 provides the terminus for a single Plex-channel (the 0th) <span class="citation">[cite: 1]</span>.</p>
      <p>Systematic consistency suggests that Zone-0 envelops the Zeroth-Phase of Pandemonium, but as this includes nothing beyond itself it constitutes a nominal or virtual multitude and an "absolute abstraction." <span class="citation">[cite: 1]</span> Zone-0 has no separable power of initiation, and since it does not support imps (or impulse-entities) - even of the first degree - there is no zeroth door <span class="citation">[cite: 1]</span>.</p>
      <p>Zone-0 is allotted the Sarkonian Mesh-Tag 0000 <span class="citation">[cite: 1]</span>.</p>

      <h3>Phase-0 Lemurs</h3>
      <p>Phase-0 tolerates no populations of any kind <span class="citation">[cite: 1]</span>.</p>

      <p>The figure one (1) - elaborated from a simple vertical stroke - is at least semi-ideographic as a relic tally-mark (basically identical in this respect to the Roman numeral 'I') <span class="citation">[cite: 1]</span>. This figure has obvious phallic resonance (especially in contrast to the sign for zero (0)) <span class="citation">[cite: 1]</span>. Its relation to the figure seven (7) is supported by numerological analyses (since seven cumulated (28) reduces to one) <span class="citation">[cite: 1]</span>.</p>
      <p>The figure '1' designates the number one, first odd number (with odditude of aleph-null), and the zeroth prime (first prime = 2) <span class="citation">[cite: 1]</span>. One is the lowest cardinal number, and the first ordinal <span class="citation">[cite: 1]</span>. One digitally cumulates to one <span class="citation">[cite: 1]</span>. Numeric Keypad direction: South-West <span class="citation">[cite: 1]</span>.</p>

      <h3>The First Planet: Mercury</h3>
      <p>Mercury is the innermost planet of the Solar-system (with a mean orbital distance from the sun of approx. 58 000 000 km) <span class="citation">[cite: 1]</span>. The mercurian year (approx. 88 Earth-days in length) is also the swiftest, which accounts for it's use as the base calculative unit in planetwork calendrics <span class="citation">[cite: 1]</span>.</p>
      <p>In Roman mythology Mercury (a latinization of the greek Hermes) is known as the messenger of the gods, associated with communication and trade <span class="citation">[cite: 1]</span>. In Lemurian Planetwork Mercury is astrozygonomously paired with Neptune <span class="citation">[cite: 1]</span>.</p>

      <h3>The Ninth Planet: Pluto</h3>
      <p>Pluto (or Sol-9) has the most highly elliptical orbital trajectory of any planet in the Solar-system, with a (highly variable) mean orbital distance from the sun of approx. 5 913 520 000 km <span class="citation">[cite: 1]</span>. Pluto was not discovered until 1930 <span class="citation">[cite: 1]</span>.</p>
      <p>In Lemurian Planetwork Pluto is astrozygonomously paired with the Sun <span class="citation">[cite: 1]</span>.</p>

      <h3>System Notes</h3>
      <p>Zone-9 is the second of the two zones mutually composing the Plex-region of the Numogram, and Tractor-Zone for the 9-0 (or 'Plex') current <span class="citation">[cite: 1]</span>. Its Plex-complement and Syzygetic-twin is Zone-0 <span class="citation">[cite: 1]</span>. This 9+0 Syzygy (carried by the demon Uttunul) draws the outermost curve of the Barker-spiral, which coincides with the limit ordinal-span in Barkerian arithmetic <span class="citation">[cite: 1]</span>.</p>
      <p>Zone-9 both initiates and envelops the Ninth-Phase of Pandemonium (including 512 impulse-entities, one half of the fully disorganized population) <span class="citation">[cite: 1]</span>. In the first of these aspects it functions as the Ninth (or Ultimate) Door, which degenerated Muvian sorceries identify with the syzygetic xenodemon (and imp of the first degree) Uttunul (9::0) <span class="citation">[cite: 1]</span>.</p>
      <p>Zone-9 is allotted the Sarkonian Mesh-Tag 0511 <span class="citation">[cite: 1]</span>. Lemurian subcultures associate Zone-9 with the Cthellloid metallic ocean of the earth’s iron core <span class="citation">[cite: 1]</span>.</p>
